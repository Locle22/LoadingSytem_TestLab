[package]
name = "app_cli"
version = "0.1.0"
edition = "2021"
description = "CLI thin client for YOLOv9e mosquito species detection"

[dependencies]
ai_vision = { path = "../ai_vision" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
minifb = "0.27"
image = "0.25"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
async-stream = "0.3"
tokio-modbus = { version = "0.14", default-features = false, features = ["rtu"] }
tokio-serial = "5.4"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
zip = "0.6"

[features]
default = []
cuda = ["ai_vision/cuda"]
tensorrt = ["ai_vision/tensorrt"]
